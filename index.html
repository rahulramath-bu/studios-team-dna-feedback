<!doctype html>
<html lang="en" data-theme="uplift">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team DNA Launchpad</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', (event) => {
        document.body.dataset.appError = event.message || 'Unknown app error';
      });
      window.addEventListener('unhandledrejection', (event) => {
        document.body.dataset.appError =
          event.reason?.message || String(event.reason || 'Unknown app rejection');
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
